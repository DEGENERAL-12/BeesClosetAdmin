        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-surface text-on-surface font-body-base min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<nav class="fixed top-0 z-50 w-full bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-purple-500/10 dark:border-purple-400/10 flex justify-between items-center px-8 py-4">
<div class="flex items-center gap-2">
<div class="size-10 rounded-full flex items-center justify-center text-white">
<span class="material-symbols-outlined">
    <img src="logo.png" />
</span>
</div>
<span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white font-headline-lg">BeesCloset</span>
</div>

</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-container-padding pt-24 pb-12 bg-gradient-to-tr from-surface via-surface-container-low to-surface">
<div class="w-full max-w-md">
<!-- Login Card -->
<div class="bg-white border border-primary/10 rounded-xl p-8 shadow-2xl shadow-primary/5">
<!-- Card Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-4">
<span class="material-symbols-outlined text-primary-container text-2xl" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Admin Login</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Enter your credentials to access the suite</p>
</div>
<!-- Form -->
<form class="space-y-6" action="index.html">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-outline uppercase" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline">
<span class="material-symbols-outlined text-lg">mail</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border-none rounded-lg focus:ring-2 focus:ring-primary-container transition-all font-body-base text-on-surface" id="email" name="email" placeholder="admin@luxejewel.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-outline uppercase" for="password">Password</label>
<a class="text-body-sm font-body-sm text-primary-container hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline">
<span class="material-symbols-outlined text-lg">lock</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border-none rounded-lg focus:ring-2 focus:ring-primary-container transition-all font-body-base text-on-surface pr-12" id="password" name="password" placeholder="••••••••" type="password"/><button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary-container transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-lg" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 block text-body-sm font-body-sm text-on-surface-variant" for="remember">
                            Remember me for 30 days
                        </label>
</div>
<!-- Submit Button -->
<button class="w-full py-3 px-4 bg-primary-container text-on-secondary font-headline-md text-headline-md rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:opacity-80 transition-all duration-150 flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined">login</span>
</button>
</form>

</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-transparent">
<div class="flex flex-col md:flex-row justify-between items-center px-8 py-6 w-full max-w-7xl mx-auto border-t border-primary/5">
<p class="font-manrope text-xs tracking-wide text-slate-400 dark:text-slate-500 mb-4 md:mb-0">
                © <script>document.write(new Date().getFullYear())</script> BeesCloset Administrative Suite. All rights reserved.
            </p>
<div class="flex gap-6">
<a class="font-manrope text-xs tracking-wide text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-all" href="#">Privacy Policy</a>
<a class="font-manrope text-xs tracking-wide text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-all" href="#">Terms of Service</a>
<a class="font-manrope text-xs tracking-wide text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-all" href="#">Security</a>
</div>
</div>
</footer>
<script>
    document.getElementById('toggle-password').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('password-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            passwordIcon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            passwordIcon.textContent = 'visibility';
        }
    });
</script></body></html>
